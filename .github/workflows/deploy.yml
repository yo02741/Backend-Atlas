name: Deploy（GitHub Pages + Firebase Hosting）

# 同一份 build 部署到兩個地方：GitHub Pages（yo02741.github.io/Backend-Atlas/）與 Firebase Hosting（backend-atlas.web.app）。
# Firebase 那一段需要 repo secret FIREBASE_SERVICE_ACCOUNT（服務帳戶 JSON 金鑰），沒設定就跳過，不會讓整個 workflow 失敗。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: 校驗內容與題庫、進度合併單元測試
        run: npm run validate && npm run test:unit

      - name: Build（含複製 Pyodide 到 public/pyodide）
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  firebase-hosting:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: 沒有部署金鑰就跳過
        if: env.FIREBASE_SA == ''
        run: echo "::notice::沒有設定 FIREBASE_SERVICE_ACCOUNT，略過 Firebase Hosting 部署（README「Firebase Hosting」有設定步驟）"

      - uses: actions/checkout@v4
        if: env.FIREBASE_SA != ''

      # 直接用 build job 上傳給 Pages 的那份產物（tar），兩邊部署的內容完全相同
      - uses: actions/download-artifact@v4
        if: env.FIREBASE_SA != ''
        with:
          name: github-pages
          path: artifact

      - name: 解開成 dist/
        if: env.FIREBASE_SA != ''
        run: mkdir -p dist && tar -xf artifact/artifact.tar -C dist && ls dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SA != ''
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: backend-atlas
          channelId: live
