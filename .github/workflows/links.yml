# 外部連結檢查：課程內文的延伸閱讀與深入內容裡的連結。每月跑一次，也可以在 Actions 頁手動觸發。
# 失效的連結會讓這個 workflow 失敗（不影響部署）；結果在執行頁的 Summary。
name: Links（外部連結檢查）

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 5 * *'   # 每月 5 日 09:17（台北）

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
