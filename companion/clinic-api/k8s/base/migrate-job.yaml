# 用同一個映像跑一次 migration。Job 的 Pod template 建立後不能改，所以每一版一個 Job：
# overlay 套用時，名稱會接上映像的 tag（overlays/*/kustomization.yaml 的 replacements），
# 例如 clinic-migrate-v1；映像和 Deployment 一樣由 overlay 的 images 設定。
apiVersion: batch/v1
kind: Job
metadata:
  name: clinic-migrate
  namespace: clinic
  labels:
    app.kubernetes.io/component: migration   # 正式環境的 deploy job 先只套用有這個 label 的物件
spec:
  backoffLimit: 0                  # 失敗不自動重試，交給人看
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400   # 結束一天後自動清掉
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: registry.gitlab.example/clinic/api:3f9c2a1b
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinic-api-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
