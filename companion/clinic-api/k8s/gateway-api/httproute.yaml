# 選讀：服務的團隊管的部分，對應 overlays/production/ingress.yaml 那份 Ingress 的規則。
# 接線換成 parentRefs（掛到哪個 Gateway）與 backendRefs（Service 的名稱與 port），Service 以後的部分不變。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clinic-api
  namespace: clinic
spec:
  parentRefs:
    - name: clinic-gateway
  hostnames: ["clinic.example"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: clinic-api
          port: 80
