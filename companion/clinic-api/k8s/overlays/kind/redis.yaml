# 只供本機使用的 Redis（快取與限流，不保存資料）。正式環境連既有的 Redis，位址在 ConfigMap 的 REDIS_URL；
# base 的 REDIS_URL 寫的是 redis.clinic.svc.cluster.local，正好對到這裡的 Service，所以 kind 不用改它。
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: clinic
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
