# 只有正式環境有：kind 叢集沒有 Ingress controller，本機用 port-forward（見 docs/local-k8s.md）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic-api
  namespace: clinic
spec:
  ingressClassName: nginx          # 示意：換成叢集實際的 IngressClass（kubectl get ingressclass）；ingress-nginx 已停止維護，用哪個 controller 先問叢集管理者
  tls:
    - hosts:
        - clinic.example
      secretName: clinic-tls       # 型別 kubernetes.io/tls，放憑證與私鑰；不在這個目錄裡
  rules:
    - host: clinic.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinic-api
                port:
                  number: 80
