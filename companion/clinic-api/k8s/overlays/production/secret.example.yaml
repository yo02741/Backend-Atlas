# Secret 的「範本」：只說明需要哪些 key，不含真實值。真正的 Secret 建在叢集裡，明文不進 Git。
# 這個檔案沒有列在 kustomization.yaml 的 resources 裡，kubectl apply -k 不會套用它。
#
# 建議的建立方式（prod.env 不進版控，已列在 .gitignore）：
#   kubectl create secret generic clinic-api-secret -n clinic --from-env-file=prod.env
#
# Secret 的值只是 base64 編碼，不是加密：用 RBAC 限制誰能讀。
apiVersion: v1
kind: Secret
metadata:
  name: clinic-api-secret
  namespace: clinic
type: Opaque
stringData:
  DATABASE_URL: "<填入：PostgreSQL 連線字串，主機是既有的資料庫主機>"
  JWT_SECRET: "<填入：至少 32 個字元的隨機字串，例如 openssl rand -base64 48 的輸出>"
