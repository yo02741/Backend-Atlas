# 第 7 階段的 nginx 設定（dist/ 用 BASE_PATH=/clinic/ 建置，放在 /usr/share/nginx/html/clinic/）。
# /api/ 原樣轉給 clinic-api：契約的路徑本來就在 /api 底下，proxy_pass 不寫 URI 部分，不改寫路徑。
# api 是 clinic-api 的 compose 裡的服務名稱：容器要加入那個 compose 的網路（clinic_default）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 檔名帶 hash：存一年；找不到就 404，不要換成 index.html
    location /clinic/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 頁面路徑找不到檔案時回 /clinic/index.html；index.html 與 config.js 每次都要向伺服器確認
    location /clinic/ {
        try_files $uri $uri/ /clinic/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
